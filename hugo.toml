# 站点根配置
baseURL = "https://liqirui1145.github.io/"
title = "大漠胡杨"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
enableEmoji = true
enableRobotsTXT = true
summaryLength = 40

# 文章默认放在 content/posts 下
[permalinks]
  posts = "/posts/:year/:month/:slug/"

[taxonomies]
  tag = "tags"

[params]
  author = "liqirui"
  description = "记录 Linux、同学和瓜那些事。"
  # 首页的一句话：只写自己真会写的话
  tagline = "只记能复现的坑，和那些说不清的事。"
  # 页脚年份起点
  since = 2026

# 评论：giscus（基于 GitHub Discussions）
# 安装 giscus App、开启 Discussions 后，把仓库 ID 和分类 ID 填在这里。
[params.giscus]
  repo = "liqirui1145/liqirui1145.github.io"
  repoid = "R_kgDOVuOtNA"
  category = "Announcements"
  categoryid = "DIC_kwDOVuOtNM4DLl6j"
  mapping = "pathname"
  strict = "1"
  reactionsenabled = "1"
  inputposition = "top"
  lang = "zh-CN"

# 顶部导航
[[menus.main]]
  name = "文章"
  pageRef = "/posts"
  weight = 1

[[menus.main]]
  name = "归档"
  pageRef = "/archives"
  weight = 2

[[menus.main]]
  name = "标签"
  pageRef = "/tags"
  weight = 3

[[menus.main]]
  name = "关于"
  pageRef = "/about"
  weight = 4

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 允许在 Markdown 里直接写 HTML，写博客时方便
      unsafe = true
  [markup.highlight]
    # 使用 class 输出，代码配色由 main.scss 编译后的 .chroma 控制，
    # 让代码块跟随页面的 --bg-soft / --text / --accent。
    noClasses = false
    style = "monokai"
    lineNos = false
    tabWidth = 2

[outputs]
  home = ["HTML", "RSS"]

[minify]
  minifyOutput = false
