<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "zh-CN" }}" data-theme="light">
<head>
  {{- partial "head.html" . -}}
</head>
<body class="{{ if .IsHome }}is-home{{ else }}is-subpage{{ end }}{{ if and .IsPage (eq .Section "posts") }} is-post{{ end }}">
  <a class="skip-link" href="#main">跳到正文</a>

  {{- partial "header.html" . -}}

  <main id="main" class="{{ if .IsHome }}home-main{{ else if and .IsPage (eq .Section "posts") }}post-main{{ else }}page-main wrap{{ end }}">
    {{- block "main" . }}{{ end -}}
  </main>

  {{- partial "footer.html" . -}}

  <script>
    (function () {
      var root = document.documentElement;

      // 主题切换：跟随系统 + 手动覆盖
      var btn = document.getElementById("theme-toggle");
      if (btn) {
        btn.addEventListener("click", function () {
          var next = root.dataset.theme === "dark" ? "light" : "dark";
          root.dataset.theme = next;
          try { localStorage.setItem("theme", next); } catch (e) {}
        });
      }

      var media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
      if (media && media.addEventListener) {
        media.addEventListener("change", function (event) {
          var saved = null;
          try { saved = localStorage.getItem("theme"); } catch (e) {}
          if (!saved) root.dataset.theme = event.matches ? "dark" : "light";
        });
      }

      // 打印按钮
      var printBtn = document.querySelector("[data-print]");
      if (printBtn) {
        printBtn.addEventListener("click", function () { window.print(); });
      }

      // 目录高亮
      var toc = document.querySelector(".toc-card");
      if (toc) {
        var links = Array.prototype.slice.call(toc.querySelectorAll('a[href^="#"]'));
        var targets = links.map(function (link) {
          var id = decodeURIComponent(link.hash.slice(1));
          return document.getElementById(id);
        }).filter(Boolean);

        if (targets.length) {
          var ticking = false;
          function updateToc() {
            ticking = false;
            var y = window.scrollY + 120;
            var current = targets[0];
            for (var i = 0; i < targets.length; i++) {
              if (targets[i].getBoundingClientRect().top + window.scrollY <= y) current = targets[i];
            }
            links.forEach(function (link) {
              link.classList.toggle("is-active", decodeURIComponent(link.hash) === "#" + current.id);
            });
          }
          window.addEventListener("scroll", function () {
            if (!ticking) {
              ticking = true;
              requestAnimationFrame(updateToc);
            }
          }, { passive: true });
          updateToc();
        }
      }
    })();
  </script>
</body>
</html>
