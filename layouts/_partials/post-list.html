<ul class="post-list">
  {{- range . }}
  <li class="post-item">
    <a class="post-link" href="{{ .RelPermalink }}">
      <time class="post-date" datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
        {{- .Date.Format "01-02" -}}
      </time>
      <span class="entry-title">{{ .Title }}</span>
      {{- if .Params.tags -}}
        <span class="post-tags">
          {{- range first 2 .Params.tags -}}<span class="post-tag">{{ . }}</span>{{- end -}}
        </span>
      {{- end -}}
    </a>
    {{- with .Description -}}
      <p class="post-desc">{{ . }}</p>
    {{- end -}}
  </li>
  {{- end }}
</ul>
