<ul class="post-list">
  {{- range . }}
  <li class="post-item">
    <a class="post-link" href="{{ .RelPermalink }}">
      {{- if not .Date.IsZero -}}
        <time class="post-date" datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006-01-02" }}</time>
      {{- end -}}
      <span class="post-item-title">{{ .Title }}</span>
      {{- with .Description -}}
        <span class="post-desc">{{ . }}</span>
      {{- end -}}
    </a>
  </li>
  {{- end }}
</ul>
