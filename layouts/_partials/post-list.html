<ul class="post-list">
  {{- range . }}
  <li class="post-card">
    <a class="post-card-link" href="{{ .RelPermalink }}">
      <div class="post-card-meta">
        {{- if not .Date.IsZero -}}
          <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006-01-02" }}</time>
          <span class="dot">·</span>
        {{- end -}}
        <span>{{ .ReadingTime }} 分钟</span>
      </div>

      <h3 class="post-card-title">{{ .Title }}</h3>

      {{- with .Description -}}
        <p class="post-card-desc">{{ . }}</p>
      {{- end -}}

      <div class="post-card-foot">
        <span class="post-card-tags">
          {{- range first 3 .Params.tags -}}
            <span class="tag">#{{ . }}</span>
          {{- end -}}
        </span>
        <span class="post-card-more">阅读全文 <span aria-hidden="true">→</span></span>
      </div>
    </a>
  </li>
  {{- end }}
</ul>
