{{- if gt .TotalPages 1 -}}
<nav class="pagination" aria-label="分页">
  {{- if .HasPrev -}}
    <a class="page-link" href="{{ .Prev.URL }}" rel="prev">← 上一页</a>
  {{- else -}}
    <span class="page-link disabled">← 上一页</span>
  {{- end -}}

  <span class="page-info">{{ .PageNumber }} / {{ .TotalPages }}</span>

  {{- if .HasNext -}}
    <a class="page-link" href="{{ .Next.URL }}" rel="next">下一页 →</a>
  {{- else -}}
    <span class="page-link disabled">下一页 →</span>
  {{- end -}}
</nav>
{{- end -}}
