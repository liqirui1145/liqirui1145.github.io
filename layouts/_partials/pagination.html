{{- if gt .TotalPages 1 -}}
<nav class="pagination" aria-label="分页">
  {{- with .Next -}}
    <a href="{{ .URL }}" rel="next">← 更早</a>
  {{- else -}}
    <span class="disabled" aria-disabled="true">← 更早</span>
  {{- end -}}

  {{- with .Prev -}}
    <a href="{{ .URL }}" rel="prev">更新 →</a>
  {{- else -}}
    <span class="disabled" aria-disabled="true">更新 →</span>
  {{- end -}}
</nav>
{{- end -}}
