<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>
      {{- if eq (printf "%v" site.Params.since) (now.Format "2006") -}}
        © {{ site.Params.since }}
      {{- else -}}
        © {{ site.Params.since }}–{{ now.Format "2006" }}
      {{- end }}
      {{ site.Params.author }}
      <span class="sep">·</span>
      <a href="{{ "index.xml" | relURL }}">RSS</a>
      <span class="sep">·</span>
      <a href="https://github.com/liqirui1145">GitHub</a>
    </p>
    <p class="muted small">由 Hugo 构建，托管于 GitHub Pages</p>
  </div>
</footer>
