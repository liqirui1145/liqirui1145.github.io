<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <span class="footer-mark" aria-hidden="true">胡</span>
      <span>
        <strong>{{ site.Title }}</strong>
        <small>{{ site.Params.description }}</small>
      </span>
    </div>

    <p class="footer-copy">
      © {{ site.Params.since }}{{ if ne (printf "%v" site.Params.since) (now.Format "2006") }}–{{ now.Format "2006" }}{{ end }}
      {{ site.Params.author }} · 由 Hugo 构建，托管于 GitHub Pages
    </p>

    <div class="footer-links">
      <a href="{{ "index.xml" | relURL }}">RSS</a>
      <a href="https://github.com/liqirui1145" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>
</footer>
