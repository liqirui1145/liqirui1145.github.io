{{ define "main" }}
<header class="page-head">
  <h1>{{ .Title }}</h1>
  {{- with .Content -}}
    <div class="page-intro">{{ . }}</div>
  {{- else -}}
    {{- with .Description -}}<p class="page-intro">{{ . }}</p>{{- end -}}
  {{- end -}}
</header>

<ul class="tag-list">
  {{- range .Data.Terms.ByCount -}}
    <li>
      <a href="{{ .Page.RelPermalink }}">
        <span>#{{ .Page.LinkTitle }}</span>
        <span class="count">{{ .Count }} 篇</span>
      </a>
    </li>
  {{- end -}}
</ul>
{{ end }}
