{{ define "main" }}
<header class="page-head">
  <h1>{{ .Title }}</h1>
  {{- with .Content -}}
    <div class="page-intro">{{ . }}</div>
  {{- end -}}
  <p class="muted small">共 {{ len .Data.Terms }} 个标签</p>
</header>

<ul class="tagcloud">
  {{- range .Data.Terms.ByCount -}}
    <li>
      <a href="{{ .Page.RelPermalink }}">
        {{ .Page.LinkTitle }}<span class="tag-count">{{ .Count }}</span>
      </a>
    </li>
  {{- end -}}
</ul>
{{ end }}
